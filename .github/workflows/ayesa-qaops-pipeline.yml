name: Getnet Autonomous ALM & QAOps Pipeline (Zero Human-in-the-Loop)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  getnet-autonomous-alm-qaops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run RAG Engine Self-Test
        run: |
          python rag-knowledge-base/rag_engine.py --selftest

      - name: Run Complete Autonomous ALM & Bank Card QAOps Suite
        run: |
          python run_qaops_suite.py
