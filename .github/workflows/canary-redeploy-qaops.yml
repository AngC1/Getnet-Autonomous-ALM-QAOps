name: Getnet Canary Release Re-Deploy & QAOps Harness (CI/CD MCP)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      canary_release_tag:
        description: "Release tag to deploy via Canary (10% -> 50% -> 100%)"
        required: false
        default: "v2026.11.3-CANARY-PRO"
      target_product_id:
        description: "Getnet Product ID or ALL for Harness verification"
        required: false
        default: "ALL"

jobs:
  canary-redeploy-harness:
    name: "Canary Release (10% -> 50% -> 100%) + QAOps Quality Gate Harness"
    runs-on: ubuntu-latest
    steps:
      - name: "1. Checkout Repository (Getnet-Autonomous-ALM-QAOps)"
        uses: actions/checkout@v4

      - name: "2. Set up Python 3.12 Runtime"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "3. Install QAOps & MCP Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "4. Stage 1 — SAST Guardrail PCI-DSS 4.0 (redact_pan) & Motor RAG (17 Playbooks)"
        run: |
          python rag-knowledge-base/rag_engine.py --selftest

      - name: "5. Stage 2 & 3 — Canary Rollout (10% -> 50% -> 100%), CI/CD MCP & Complete QAOps Harness (25/25 Jira Xray Tests)"
        run: |
          python run_qaops_suite.py

      - name: "6. Stage 4 — Publish Canary Release Summary & Jira Xray Certification"
        if: always()
        run: |
          echo "## 🚀 Getnet Autonomous ALM — Canary Release Re-Deploy & QAOps Harness" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: \`AngC1/Getnet-Autonomous-ALM-QAOps\`" >> $GITHUB_STEP_SUMMARY
          echo "- **MCP Server**: \`getnet-github-actions-cicd-mcp\` (JSON-RPC 2.0)" >> $GITHUB_STEP_SUMMARY
          echo "- **Canary Strategy**: \`10% Canary Traffic -> 50% Validation -> 100% Production Promotion\`" >> $GITHUB_STEP_SUMMARY
          echo "- **RAG Knowledge Base**: \`17/17 Banking & TPV Playbooks Verified (TF-IDF + BM25)\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Jira Xray Matrix**: \`25/25 Test Cases PASSED (GTN-TC-001 .. GTN-TC-025)\`" >> $GITHUB_STEP_SUMMARY
